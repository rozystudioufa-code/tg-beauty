<!DOCTYPE html>
<!-- ─── index.html ──────────────────────────────────────────────────────────
     Точка входа Telegram Mini App.
     Все экраны рендерятся динамически через app.js.
     ──────────────────────────────────────────────────────────────────────── -->
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Запрет масштабирования — приложение, не сайт -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2aabee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Разиля Сунгатова — Наращивание ресниц</title>

  <!-- Telegram Mini App SDK — обязательно до любых скриптов -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Стили -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- ── Экран 1: Главная ───────────────────────────────── -->
  <div id="screen-home" class="screen is-tab"></div>

  <!-- ── Экран 2: Каталог услуг ────────────────────────── -->
  <div id="screen-catalog" class="screen is-tab"></div>

  <!-- ── Экран 3: Детали услуги ────────────────────────── -->
  <div id="screen-detail" class="screen"></div>

  <!-- ── Экран 4: Выбор даты и времени ─────────────────── -->
  <div id="screen-datetime" class="screen"></div>

  <!-- ── Экран 5: Подтверждение записи ─────────────────── -->
  <div id="screen-confirm" class="screen"></div>

  <!-- ── Экран 6: Запись подтверждена ──────────────────── -->
  <div id="screen-success" class="screen"></div>

  <!-- ── Экран 7: Мои записи ───────────────────────────── -->
  <div id="screen-bookings" class="screen is-tab"></div>

  <!-- ── Нижняя навигация ──────────────────────────────── -->
  <nav id="bottom-nav">

    <button class="nav-btn" data-tab="home" onclick="activateTab('home')">
      <!-- Иконка: домик -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span>Главная</span>
    </button>

    <button class="nav-btn" data-tab="catalog" onclick="activateTab('catalog')">
      <!-- Иконка: список с искрой -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Услуги</span>
    </button>

    <button class="nav-btn" data-tab="bookings" onclick="activateTab('bookings')">
      <!-- Иконка: календарь -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8"  y1="2" x2="8"  y2="6"/>
        <line x1="3"  y1="10" x2="21" y2="10"/>
      </svg>
      <span>Записи</span>
    </button>

  </nav>

  <!-- ── Оффер: модалка при первом открытии ────────────── -->
  <div id="offer-modal" class="offer-overlay" style="display:none">
    <div class="offer-card">
      <div class="offer-emoji">🎁</div>
      <div class="offer-title">Скидка 15% на первую запись</div>
      <div class="offer-subtitle">Подпишитесь на бота — получите промокод в личное сообщение</div>
      <ul class="offer-bullets">
        <li>Напомним о записи за день</li>
        <li>Первыми узнаёте о свободных окошках</li>
        <li>Эксклюзивные акции для подписчиков</li>
      </ul>
      <a href="https://t.me/lashmaster_ufa_bot?start=from_app"
         class="offer-btn"
         target="_blank"
         onclick="closeOffer()">
        Получить скидку 15%
      </a>
      <button class="offer-skip" onclick="closeOffer()">Пропустить</button>
    </div>
  </div>

</div><!-- /#app -->

<!-- Данные -->
<script src="data.js"></script>
<!-- Логика и рендер -->
<script src="app.js"></script>

</body>
</html>
